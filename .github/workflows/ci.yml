name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q vyron tools main.py

      - name: Protected credit
        run: python tools/check_attribution.py

      - name: Translation parity
        run: python tools/check_languages.py

      - name: Import smoke test
        run: python -c "import vyron.app, vyron.boost, vyron.trim, vyron.detection, vyron.servers, vyron.system_info, vyron.accounts; print('imports OK')"
